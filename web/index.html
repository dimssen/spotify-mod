<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Playlist Plus</title>
  <meta name="description" content="Trim songs and run timed multi-phase playlists on Spotify.">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Playlist+">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <style>
    :root {
      --bg: #121212; --card: #1e1e1e; --card2: #2a2a2a; --text: #fff; --sub: #a7a7a7;
      --accent: #1ed760; --danger: #f15e6c; --line: #333;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body {
      font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));
      max-width: 640px; margin: 0 auto;
    }
    h1 { font-size: 22px; margin: 16px 0 12px; }
    h2 { font-size: 17px; margin: 20px 0 8px; }
    p { margin: 8px 0; }
    a { color: var(--accent); }
    .card { background: var(--card); border-radius: 12px; padding: 14px; margin: 12px 0; }
    .muted { color: var(--sub); font-size: 14px; }
    .error { color: var(--danger); font-size: 14px; margin: 8px 0; }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 8px 0; }
    .grow { flex: 1 1 140px; min-width: 0; }
    input, select, textarea {
      font: inherit; font-size: 16px; color: var(--text); background: var(--card2);
      border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0;
    }
    select { max-width: 100%; }
    input[type=number] { width: 84px; }
    input.time { width: 96px; }
    input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); }
    textarea { width: 100%; height: 120px; font-family: ui-monospace, monospace; font-size: 13px; }
    label.check { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
    button {
      font: inherit; font-weight: 700; border: 0; border-radius: 999px; padding: 10px 18px;
      background: var(--accent); color: #000; cursor: pointer; min-height: 44px;
    }
    button.sec { background: transparent; color: var(--text); border: 1px solid #555; font-weight: 500; }
    button.small { padding: 6px 12px; min-height: 36px; font-size: 14px; }
    button:disabled { opacity: .4; }
    .tabs { display: flex; gap: 8px; margin: 12px 0; overflow-x: auto; }
    .tabs button { background: var(--card2); color: var(--text); font-weight: 500; white-space: nowrap; }
    .tabs button.on { background: var(--accent); color: #000; font-weight: 700; }
    .np { display: flex; flex-direction: column; gap: 4px; }
    .np .title { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar { height: 4px; background: var(--card2); border-radius: 2px; overflow: hidden; margin-top: 6px; }
    .bar > div { height: 100%; background: var(--accent); }
    .session { border: 1px solid var(--accent); }
    .session .big { font-size: 28px; font-weight: 800; }
    .list { list-style: none; padding: 0; margin: 0; }
    .list li { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .list li .grow { overflow: hidden; }
    .list li .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .phase { background: var(--card2); border-radius: 10px; padding: 10px; margin: 10px 0; }
    .phase input.name { font-weight: 700; }
    code { background: var(--card2); padding: 2px 6px; border-radius: 4px; word-break: break-all; }
    ol { padding-left: 20px; }
    ol li { margin: 6px 0; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>window.PLAYLIST_PLUS_CORE_ONLY = true;</script>
  <script src="playlist-plus.js"></script>
  <script src="app.js"></script>
</body>
</html>
